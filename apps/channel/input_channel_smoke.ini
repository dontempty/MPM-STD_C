# CPU 스모크용 미니 채널 — 조건은 re180 과 같은 꼴, 크기와 스텝만 축소.
# (해상도가 거칠어 물리값은 의미 없음 — 배선·안정성·통계 경로 확인용)

[mesh]
nx = 32
ny = 24
nz = 32

[domain]
lx = 6.28318530717958648
ly = 3.14159265358979324
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
reynolds_bulk = 2857.0
target_bulk_velocity = 1.0

[time]
dt_max = 0.05
max_cfl = 1.0
max_step = 200

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_smoke/"
monitor_interval = 20
stats_start_step = 100
stats_write_interval = 100
