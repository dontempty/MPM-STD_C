# GPU 검증판 (2 GPU, npz 2) — CPU 런과 같은 물리 설정 (2026-10-11)
# LES 격자 민감도 — Re_τ≈180 채널, 96³ (Δx⁺≈23, Δy⁺≈12, z⁺₁≈1.2; γ_z 3.0 유지, 수평 해상도만 1.5 배) — vreman012
# 비교: 우리 DNS 256³ (stats_re180_ref, Re_τ 180.9), MKM 1999. no-model 기준선 대비 개선이 모델의 의미.
[mesh]
nx = 96
ny = 96
nz = 96

[domain]
lx = 12.56637061435917295
ly = 6.28318530717958648
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
reynolds_bulk = 2857.0
target_bulk_velocity = 1.0

[boundary]
velocity_ghost = mirror   ; 2차 벽 (value 는 1차: 첫 셀 U+=2z+ 인공물)

[les]
model = constant_vreman
c_s = 0.12

[time]
dt_max = 0.05
max_cfl = 0.8
max_step = 22500          ; 64³ 의 15000 스텝(t≈650) 과 같은 물리시간: dt 가 2/3 로 줄어 1.5 배

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_les96_vreman012_mirror_gpu/"
monitor_interval = 100
stats_start_step = 9000
stats_write_interval = 4500
checkpoint_interval = 22500
checkpoint_dir = "checkpoints_les96_vreman012_mirror_gpu"
