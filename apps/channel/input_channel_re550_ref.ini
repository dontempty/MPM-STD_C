# 난류 채널 Re_tau = 550 — Filtered_TDMA/apps/channel_gpu 의 PARA_INPUT_re550_*.dat
# 과 **박스·격자·스트레칭을 1:1로 맞춘 판** (2026-10-04).
#
# ★ 박스 정정: 참조 덱의 Aspect 는 "H 배수"다 (Config.cpp:228 Lx = H·Aspect1,
#   Ly = H·Aspect2, Lz = H). Aspect1=2π, Aspect2=π, H=2 이므로
#     참조 도메인 = 4π × 2π × 2   (= 4πδ × 2πδ × 2δ, KMM 관례)
#   기존 input_channel_re550.ini 는 2π × π × 2 로 **수평 면적이 1/4** 이었다.
#   그 작은 박스가 중앙 2차 통계량 과대의 유력 원인이다 (유선방향 u' 편중).
#
# 격자는 참조와 같은 768×512×384 — 박스가 4배라 **벽단위 해상도는 기존 런과
# 거의 같다**: Δx+ 8.9, Δy+ 6.7, Δz+ 0.9(벽)~4.3(중앙) @ Re_tau 543.
# 따라서 이 런과 기존 런의 차이는 사실상 박스 크기 하나다 (+ gamma_z 3.4→3.0).
#
# 누적 표본: 기존 런은 4.4 δ/u_τ 로 짧아 중앙 통계가 수렴 전이었다(블록별 단조
# 증가). dt ≈ 0.0045 (Δx 가 기존과 같아 dt 도 비슷) 기준 30000~100000 스텝이면
# 누적 ≈ 315 시간단위 ≈ 17 δ/u_τ.

# ★ 2026-10-04 스킴 전환: 이 런부터 채널 운동량은 **가변물성 경로(μ̂≡1)** 를
#   쓴다 = 원본 core_momentum.f90 충실 구조(M-form 잔차·own×2 응력·cross-stress·
#   전진 대입). OB 경로의 "보존형 RHS + 짝 없는 이류형 음해항"이 만들던 dt 비례
#   운동량 누수(CFR 과구동 1.17~1.41배)가 사라진다 — CPU 검증: 라미나 누수 1e-13,
#   난류 시간평균 force/drag 0.98~1.01. 따라서 이 런은 기존 stats 대비
#   [박스 + 스킴] 두 가지가 동시에 바뀐 판이다.

[mesh]
nx = 768
ny = 512
nz = 384

[domain]
lx = 12.56637061435917295
ly = 6.28318530717958648
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
reynolds_bulk = 10000.0
target_bulk_velocity = 1.0

[time]
dt_max = 0.05
max_cfl = 1.0
max_step = 100000

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_re550_ref/"
monitor_interval = 100
stats_start_step = 30000
stats_write_interval = 10000
budget_interval = 2000
