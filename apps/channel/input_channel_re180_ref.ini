# 난류 채널 Re_tau = 180 — Filtered_TDMA/apps/channel_gpu 의
# PARA_INPUT_re180_pascal.dat 과 **박스까지 1:1로 맞춘 판** (2026-10-04).
#
# ★ 박스 정정: 참조 Aspect1=2π, Aspect2=π, H=2 → Lx = H·Aspect1 = 4π,
#   Ly = H·Aspect2 = 2π, Lz = 2 (Config.cpp:228). 기존 input_channel_re180.ini
#   는 2π × π 로 수평 면적이 1/4 이었다 — 격자수는 같은 256³ 이었으므로
#   기존 런은 "참조보다 2배 고해상도, 1/4 박스"였던 셈이다.
#   이 덱은 참조와 같은 박스·같은 격자 = Δx+ 8.8, Δy+ 4.4, Δz+ 0.6(벽)~2.4(중앙).
#
# 중앙 2차 통계량이 참조 DNS 보다 높던 현상(블록별로 아직 상승 중)이 박스
# 크기 때문인지 가르는 런이다. 평균은 참조(nstat_start 10000/30000 스텝)보다
# 길게 — dt ≈ 0.010 기준 20000~60000 스텝이면 누적 ≈ 400 시간단위 ≈ 26 δ/u_τ.

# ★ 2026-10-04 스킴 전환: 이 런부터 채널 운동량은 **가변물성 경로(μ̂≡1)** 를
#   쓴다 = 원본 core_momentum.f90 충실 구조(M-form 잔차·own×2 응력·cross-stress·
#   전진 대입). OB 경로의 "보존형 RHS + 짝 없는 이류형 음해항"이 만들던 dt 비례
#   운동량 누수(CFR 과구동 1.17~1.41배)가 사라진다 — CPU 검증: 라미나 누수 1e-13,
#   난류 시간평균 force/drag 0.98~1.01. 따라서 이 런은 기존 stats 대비
#   [박스 + 스킴] 두 가지가 동시에 바뀐 판이다.

[mesh]
nx = 256
ny = 256
nz = 256

[domain]
lx = 12.56637061435917295
ly = 6.28318530717958648
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
reynolds_bulk = 2857.0
target_bulk_velocity = 1.0

[time]
dt_max = 0.05
max_cfl = 1.0
max_step = 60000

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_re180_ref/"
monitor_interval = 100
stats_start_step = 20000
stats_write_interval = 5000
budget_interval = 2000
