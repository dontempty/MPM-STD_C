# GPU 검증판 (2 GPU, npz 2) — CPU 런과 같은 물리 설정 (2026-10-11)
# LES 검증 — Re_τ≈180 채널, 64³ (Δx⁺≈35, Δy⁺≈18, z⁺₁≈1.8/2) — wale (C_w 0.5)
# 비교: 우리 DNS 256³ (stats_re180_ref, Re_τ 180.9), MKM 1999. no-model 기준선 대비 개선이 모델의 의미.
[mesh]
nx = 64
ny = 64
nz = 64

[domain]
lx = 12.56637061435917295
ly = 6.28318530717958648
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
reynolds_bulk = 2857.0
target_bulk_velocity = 1.0

[boundary]
velocity_ghost = mirror   ; 2차 벽 (value 는 1차: 첫 셀 U+=2z+ 인공물)

[les]
model = wale
c_w = 0.5                 ; Nicoud & Ducros 1999 권장값

[time]
dt_max = 0.05
max_cfl = 0.8
max_step = 15000          ; 60 통과: 전이 ~25 + 통계 ~35

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_les64_wale_mirror_gpu/"
monitor_interval = 100
stats_start_step = 6000
stats_write_interval = 3000
checkpoint_interval = 15000
checkpoint_dir = "checkpoints_les64_wale_mirror_gpu"
