# LES 검증 — Vreman (2004) Phys. Fluids 16, 3670  §V.B "turbulent plane channel flow"
# 조건 정본 = 논문 지면 3676 우측 단 + Table II(지면 3678). 논문 PDF: docs/Paper/Constant_vreman.pdf
#
# 논문이 명시한 것 (그대로 맞춤):
#   Re_tau = 360
#   도메인 6H x 2H x 2H  (유선 6H / 벽수직 2H / 스팬 2H, H = 반높이)
#     -> 우리 축 관례(z = 벽수직)로 lx=6, ly=2(스팬), lz=2(벽수직)
#   격자 47 x 63 x 47 (벽수직이 63)  -> nx=47, ny=47, nz=63
#   필터폭 Delta_i = h_i                 -> 우리 Vreman 커널도 방향별 격자폭 그대로
#   벽수직 5번째 격자점이 y+ = 11        -> gamma_z = 3.8660 (아래 유도)
#   통계 평균 10 H/u_tau ~ 30 H/u_tau
#
# ★ 논문과 다른 점 1개 (사용자 결정 2026-10-06): 구동이 CFR 이다.
#   논문은 constant pressure gradient 로 u_tau 를 고정하고 c_f/C_f 로 판정한다(Table II).
#   우리 channel 앱은 CFR 전용이라 Re_tau 가 출력이 된다 — 따라서 판정은
#   "Re_tau 가 360 에 얼마나 가까운가 + U+ 프로파일" 로 하고, Table II 의
#   c_f/C_f 수치와 직접 비교하지는 않는다.
#
# Re_b 보정: Re_tau = 0.09*(2*Re_b)^0.88 (참조 Fortran core_LES.f90:107 의 Es_Retau 식).
#   우리 실측으로 검산 — Re_b 2857 -> 182.1(실측 180.9), Re_b 10000 -> 548.5(실측 551).
#   Re_tau = 360 -> Re_b = 6198.
#
# gamma_z 유도: make_tanh_faces(nz=63, lz=2, gamma) 의 5번째 셀중심이 z+ = 11 (Re_tau 360)
#   -> gamma_z = 3.8660. 결과 z+ 셀중심 1~6 = 0.98, 3.07, 5.41, 8.05, 11.00, 14.31
#   dz+ 벽 1.96 -> 중앙 23.0,  dx+ = 46.0 (6H/47),  dy+(스팬) = 15.3 (2H/47)
#
# 통계 구간: u_tau = Re_tau*nu/delta = 360/6198 = 0.058083  ->  H/u_tau = 17.22 시간단위.
#   논문 10~30 H/u_tau = t 172.2 ~ 516.6. 이 앱은 스텝 기준이라 dt 로 환산해야 하는데,
#   ★ 1차 투입(잡 35717) 실측 dt = none 0.0192 / C_s0.12 0.0258 / C_s0.17 0.0303 (케이스마다 다름).
#   가장 작은 dt(none) 기준으로 잡아 모든 케이스가 >= 10 H/u_tau 전이 + >= 20 H/u_tau 평균이 되게:
#     stats_start_step 9000  -> 전이 10.0 ~ 15.8 H/u_tau
#     max_step        30000  -> 끝    33.4 ~ 52.8 H/u_tau,  평균 창 23.4 ~ 37.0 H/u_tau
#   dt 가 큰 케이스는 논문보다 더 오래 평균한다(보수적). 0.03 s/step 이라 30000 스텝 = 약 15 분.
#   ★ 실제 누적 구간은 plot/plot_les.ipynb 가 stats 헤더(step, samples)에서 복원해 찍는다.
#
# Const-Vreman C_s = 0.12 -> c_v = 2.5*0.12^2 = 0.036 (참조 Fortran MPM-STD 상수).
# Re_tau 180 64^3 에서 최적이던 값 — 논문 격자/Re 에서도 그런지 본다.

[mesh]
nx = 47
ny = 47
nz = 63

[domain]
lx = 6.0
ly = 2.0
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.8660

[process]
npx = 1
npy = 1
npz = 7                   ; 63 = 7 x 9 (nz 는 npz 로 나누어떨어져야 한다; 약수 1,3,7,9,21,63)

[physics]
reynolds_bulk = 6198.0
target_bulk_velocity = 1.0

[les]
model = constant_vreman
c_s = 0.12

[time]
dt_max = 0.05
max_cfl = 0.8
max_step = 30000

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_re360_les_vreman012/"
monitor_interval = 100
stats_start_step = 9000
stats_write_interval = 2000
checkpoint_interval = 30000
checkpoint_dir = "checkpoints_re360_les_vreman012"
