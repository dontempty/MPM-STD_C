; rbc_nob 확장성 weak — 전역 1024x2048x2048, 2x4x4 랭크 (pencil)
; gen_decks.py 생성 — 손으로 고치지 말고 다시 생성할 것
[mesh]
nx = 1024
ny = 2048
nz = 2048

[domain]
lx = 12.0
ly = 24.0
lz = 4.0

[stretch]
uniform_z = false
gamma_z = 2.6

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[process]
npx = 2
npy = 4
npz = 4

[time]
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
monitor_interval = 50

[timing]
warmup_steps = 50
