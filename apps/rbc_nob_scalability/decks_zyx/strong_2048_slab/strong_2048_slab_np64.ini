; rbc_nob 확장성 strong — 전역 2048x2048x2048, 1x1x64 랭크 (slab)
; gen_decks.py 생성 — 손으로 고치지 말고 다시 생성할 것
[mesh]
nx = 2048
ny = 2048
nz = 2048

[domain]
lx = 24.0
ly = 24.0
lz = 4.0

[stretch]
uniform_z = false
gamma_z = 2.6

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[process]
npx = 1
npy = 1
npz = 64

[time]
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
monitor_interval = 50

[timing]
warmup_steps = 50
