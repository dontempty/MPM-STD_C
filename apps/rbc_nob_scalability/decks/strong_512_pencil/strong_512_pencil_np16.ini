; rbc_nob 확장성 strong — 전역 512x512x512, 4x2x2 랭크 (pencil)
; gen_decks.py 생성 — 손으로 고치지 말고 다시 생성할 것
[mesh]
nx = 512
ny = 512
nz = 512

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[process]
npx = 4
npy = 2
npz = 2

[time]
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
monitor_interval = 50

[timing]
warmup_steps = 50
