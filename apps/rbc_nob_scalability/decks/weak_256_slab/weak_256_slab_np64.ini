; rbc_nob 확장성 weak — 전역 256x256x16384, 1x1x64 랭크 (slab)
; gen_decks.py 생성 — 손으로 고치지 말고 다시 생성할 것
[mesh]
nx = 256
ny = 256
nz = 16384

[domain]
lx = 6.0
ly = 6.0
lz = 64.0

[stretch]
uniform_z = false
gamma_z = 2.6

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[process]
npx = 1
npy = 1
npz = 64

[time]
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
monitor_interval = 50

[timing]
warmup_steps = 50
