# channel_ftdma 통계 런 — 256³ DNS Re_τ 180, 2x2x2 (GPU 8장), 백엔드 = filtered (2026-10-28)
# 덱 본문 = apps/channel/input_channel_re180_ref.ini (Filtered_TDMA/apps/channel_gpu re180 과 같은 박스 4π×2π×2, Re_b 2857)
# 바꾼 것: 분할 2x2x2, 20 만 스텝, 통계 2 만 스텝부터 1 만 스텝마다 누적 파일(구간 18 개), 2 만 스텝마다 체크포인트
# (2 만 스텝 체크포인트 = 시간 측정 런의 난류 시작장). 두 백엔드 덱은 출력 이름만 다르다.
# 실행 파일: build_gpu_filtered/bin/channel_ftdma
[mesh]
nx = 256
ny = 256
nz = 256

[domain]
lx = 12.56637061435917295
ly = 6.28318530717958648
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 2
npy = 2
npz = 2

[physics]
reynolds_bulk = 2857.0
target_bulk_velocity = 1.0

[time]
dt_max = 0.05
max_cfl = 1.0
max_step = 200000

[initial]
pert_amp = 0.5

[output]
stats_dir = "stats_dns256_filtered_2x2x2/"
checkpoint_interval = 20000
checkpoint_dir = "checkpoints_dns256_filtered_2x2x2"
monitor_interval = 100
stats_start_step = 20000
stats_write_interval = 10000
budget_interval = 2000
