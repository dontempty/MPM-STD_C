; OB 충실경로 스모크 — rbc_nob smoke_ob_limit(ΔT 0) 과 같은 덱: FINAL 이 가변경로 ΔT=0 스모크(θ_c −0.00004, Nu 94.664)와 같은 자릿수인지 대조.
[mesh]
nx = 32
ny = 32
nz = 32

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05

[time]
end_time = 20.0
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 6

[output]
stats_dir        = "stats_ob_smoke/"
monitor_interval = 50
stats_start_time = 10.0
stats_interval   = 5.0
stats_sample_interval = 2
