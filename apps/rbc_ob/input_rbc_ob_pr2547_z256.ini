; OB(충실 상수물성 커널) 본런 — NOB fig9 본런 덱(apps/rbc_nob/input_rbc_nob_dt40.ini)과 **같은 조건**, 물성만 상수:
;   128×128×256, 6×6×1, γ_z 2.6, Ra 1e6, Pr 2547(글리세롤), perturb 0.05, 냉시작, CFL 0.3, dt_max 0.05,
;   통계 16900 부터 1000 간격(표본 5스텝), 체크포인트 50000 스텝. 종료만 25000 → 27000 으로 늘려 NOB base
;   확장통계 창(25300~27000)도 겹친다.
; 목적: NOB 윗벽(차가운 벽) 속도 rms 스파이크가 상수물성에서 나는지 — 윗/아랫벽 근처 u_h·w·T rms 대칭 확인 (2026-10-13).
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05

[time]
end_time = 27000.0
dt_max = 0.05
max_cfl = 0.3

[output]
checkpoint_interval = 50000
checkpoint_dir   = "checkpoints_pr2547_z256/"
stats_dir        = "stats_ob_pr2547_z256/"
monitor_interval = 1000
stats_start_time = 16900.0
stats_interval   = 1000.0
stats_sample_interval = 5
