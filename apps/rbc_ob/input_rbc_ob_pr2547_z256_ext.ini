; OB(rbc_ob) 연장 런 — t 27000 체크포인트에서 2000 time 더 돌리며 **확장 통계(시간평균 T·W 장: Re_pl, 시간평균 T PDF)** 를 누적.
; NOB cv12 캠페인(Horn 2013 fig.8·12·13·14)의 OB 참조값 생산용 (2026-10-14). 조건은 본런과 동일.
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05
restart_from = "checkpoints_pr2547_z256/rbc_ob_ck_00541175.bin"

[time]
end_time = 29000.0
dt_max = 0.05
max_cfl = 0.3

[output]
checkpoint_interval = 0
checkpoint_dir   = "checkpoints_pr2547_z256/"
stats_dir        = "stats_ob_pr2547_z256_ext/"
monitor_interval = 1000
stats_start_time = 27000.0
stats_interval   = 500.0
stats_sample_interval = 5
