; rbc_ob(충실 상수물성) Kerr 검증 — legacy rbc 앱이 통과한 케이스(Ra 1e6, Pr 0.7, 192×192×96, Nu 격자외삽 8.33 = Kerr 1996)를 새 앱으로 회귀 (2026-10-14).
; 덱은 apps/rbc/input_rbc_ra1e6_fine.ini 와 동일(통계 125~250, 매 스텝 표본).

[mesh]
nx = 192
ny = 192
nz = 96

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z   = 2.6

[process]
npx = 1
npy = 1
npz = 2

[physics]
rayleigh          = 1.0e6
prandtl           = 0.7
delta_temperature = 0
gravity_axis      = 2

[initial]
perturb = 0.02

[time]
end_time = 250.0
dt_max   = 0.05
max_cfl  = 0.3
max_step = 0

[output]
stats_dir        = "stats_ob_ra1e6_pr07_kerr/"
monitor_interval = 100
stats_start_time = 125.0
stats_interval   = 25.0
stats_sample_interval = 1
checkpoint_interval = 0
