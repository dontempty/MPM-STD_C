# DHVC Ra=1e10 축소 상자 (2026-10-23) — 사용자 격자 6400×1464×3200(8×4×1)과 같은 해상도, 상자만 4×1×1:
#   3200×366×3200 = 37.5억 셀 (Δx 1/800, Δy 1/366, z 스트레칭 gamma 2.6). z(벽 간격)는 Ra 기준 길이라 유지.
# 메모리: 1단계 메모리 최적화(셀당 258 B) 후 H200 ×8 에서 GPU 당 ~113 GiB (80 %). 최적화 전(331 B)은 103 % 로 불가.
# 초기조건: Ra 1e9 4×2 상자 체크포인트를 격자보간 warm-start (y 는 2 → 1 로 1/2 압축). 분할 1x1x8 은 잡 스크립트가 치환.
# 체크포인트 한 개 ≈ 150 GB, 루트 랭크가 장 5개 전역 배열을 호스트에 모은다 → 잡 메모리 넉넉히 (--mem-per-cpu 19000M × 32).
[mesh]
nx = 3200
ny = 366
nz = 3200
[domain]
lx = 4.0
ly = 1.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = NPX_VAL
npy = NPY_VAL
npz = NPZ_VAL
[physics]
rayleigh = 1.0e10
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 1000.0        ; 2일 한도까지 돌리고 체크포인트로 이어 간다 (8장 ≈ 0.53 s/step → 한 잡에 약 60 time)
dt_max = 0.0005
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e10_box/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 25.0
checkpoint_interval = 30000   ; ≈ 4.4 h 마다 (150 GB)
checkpoint_dir = "restart_1e10_box"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 1000
