# DHVC fig7 Ra=1e8 — mirror 벽 + 확장 통계(Ng 2017 전 항목), 4 GPU (gpu01+gpu02, npz=4). 확장 1e7 mirror 런(잡 35992) 마지막 체크포인트 t=200 에서 격자보간 warm-start (2026-10-09). warm-start 는 t=0 부터: 과도 30 time + 통계 100 time.
[mesh]
nx = 1536
ny = 340
nz = 768
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 4
[physics]
rayleigh = 1.0e8
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 130.0           ; 과도 30 + 통계 100 (사용자 지시 2026-10-09)
dt_max = 0.002
max_cfl = 1.0
max_step = 0
[boundary]
velocity_ghost = mirror   ; 2차 벽 (사용자 결정 2026-10-07: 가장 정확한 벽으로) — 축 kind 는 기본(x·y 주기, z 벽)

[initial]
perturb = 0.05
warmstart_from = "/shared/home/wel1come1234/workspace/MPM-STD/apps/dhvc/restart_1e7_mirror/dhvc_ck_00076150.bin"   ; 1e7 mirror 확장 통계 런 t=200.0
[output]
stats_dir = "out_1e8_ext/"
monitor_interval = 100
stats_start_time = 30.0    ; warm-start 후 30 time 과도 뒤
stats_interval = 20.0      ; 20 time 마다 통계 파일 (사용자 지시 2026-10-07)
checkpoint_interval = 40000
checkpoint_dir = "restart_1e8_ext"
stats_sample_interval = 10  ; 1e8: 35 회 평면 축소/표본 → 10 스텝마다(dt≈0.0006, 0.006 time)
conditional_interval = 10
spectra_interval = 500
