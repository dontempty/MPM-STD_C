# DHVC 스모크 — 배선·안정성 확인용 미니 (물리값 의미 없음)
[mesh]
nx = 48
ny = 24
nz = 32
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 2
[physics]
rayleigh = 1.0e5
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 5.0
dt_max = 0.02
max_cfl = 0.4
max_step = 0
[initial]
perturb = 0.05
[output]
stats_dir = "stats_smoke_gpu/"
monitor_interval = 50
stats_start_time = 2.0
stats_interval = 1.0
stats_sample_interval = 2
conditional_interval = 2
spectra_interval = 10
