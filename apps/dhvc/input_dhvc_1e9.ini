# DHVC Ra=1e9 — 1e8 덱과 같은 도메인(8×4×1)·스트레칭, 격자 3200×664×1600 (2026-10-20).
# 1e7(검증 런, t 200) 체크포인트를 격자보간 warm-start. npz 는 잡 스크립트가 GPU 수로 치환(NPZ_VAL).
# 디바이스 메모리 실측 320 B/cell → 전체 ~1010 GiB: H200 ×8 에서만(GPU 당 ~127 GiB) 들어간다.
[mesh]
nx = 3200
ny = 664
nz = 1600
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = NPZ_VAL
[physics]
rayleigh = 1.0e9
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 150.0
dt_max = 0.001
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e9/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 25.0
checkpoint_interval = 10000
checkpoint_dir = "restart_1e9"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 1000
