# DHVC fig7 Ra=1e6 — mirror 벽 + 확장 통계(Ng 2017 전 항목), 2 GPU. 기존 value 벽 런(t=240) 마지막 체크포인트에서 재시작: 과도 30 + 통계 180 (기존 창 길이와 동일) (2026-10-11).
[mesh]
nx = 384
ny = 192
nz = 96
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 2
[physics]
rayleigh = 1.0e6
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 450.0          ; 240 + 과도 30 + 통계 180
dt_max = 0.02
max_cfl = 0.4
max_step = 0
[boundary]
velocity_ghost = mirror   ; 2차 벽 (1e7·1e8 확장 런과 같은 설정)
[initial]
perturb = 0.05
restart_from = "/shared/home/wel1come1234/workspace/MPM-STD/apps/dhvc/restart_1e6/dhvc_ck_00097169.bin"   ; t = 240 (value 벽 런)
[output]
stats_dir = "out_1e6_ext/"
monitor_interval = 100
stats_start_time = 270.0
stats_interval = 30.0
checkpoint_interval = 20000
checkpoint_dir = "restart_1e6_ext"
stats_sample_interval = 1   ; 확장 통계 표본 간격(스텝) — 1e5·1e6 은 매 스텝
conditional_interval = 1    ; |Ri_f| 조건평균(0 = stats_sample_interval)
spectra_interval = 100      ; u 스펙트럼
