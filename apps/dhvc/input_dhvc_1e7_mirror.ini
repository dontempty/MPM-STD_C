# DHVC fig7 Ra=1e7 — mirror 벽 + 확장 통계(Ng 2017 전 항목) 재검증 (2026-10-09). 1e6 restart 격자보간 warm-start, 2 GPU.
[mesh]
nx = 832
ny = 416
nz = 192
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 2
[physics]
rayleigh = 1.0e7
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[boundary]
velocity_ghost = mirror   ; 2차 벽 (value 는 1차) — 1e8 mirror 와 같은 설정

[time]
end_time = 200.0        ; 통계 100~200 (100 time 창, 20 간격 파일)
dt_max = 0.005
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e7_mirror/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 20.0
checkpoint_interval = 20000
checkpoint_dir = "restart_1e7_mirror"
stats_sample_interval = 5
conditional_interval = 5
spectra_interval = 100
