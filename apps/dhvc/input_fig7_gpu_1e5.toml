# DHVC GPU — Ra=1e5, np1=1 np2=1 np3=2 (2×A100). Long convergence run:
# ~18 LSC oscillation periods (period ~30-40 t-units) for a settled time-average.
[domain]
Lx = 8.0
Ly = 4.0
Lz = 1.0
[mesh]
n1m = 384
n2m = 192
n3m = 96
[mpi]
np1 = 1
np2 = 1
np3 = 2
[uniform_mesh]
uniform1 = 1
uniform2 = 1
uniform3 = 0
[mesh_stretch]
gamma1 = 0.0
gamma2 = 0.0
gamma3 = 2.6
[physics]
Ra = 1.0e5
Pr = 0.7
[topology]
x = "periodic"
y = "periodic"
z = "wall"
[bc.z.minus]
T = 0.5
[bc.z.plus]
T = -0.5
[time]
t_start  = 0.0
t_end    = 240.0
dt_start = 0.02
MaxCFL   = 0.4
n_steps  = 500000
[init]
perturb = 0.05
[output]
dir_stats   = "apps/dhvc/out_1e5/"
nmonitor    = 100
t_stat_start = 60.0
nstat        = 10
t_stat_out   = 30.0
