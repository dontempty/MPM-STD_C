# DHVC 1e9 축소 상자 속도 시험 — 60 스텝, 통계·스펙트럼·체크포인트 끔. 분할 비교용 (2026-10-20).
[mesh]
nx = 1600
ny = 332
nz = 1600
[domain]
lx = 4.0
ly = 2.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = NPX_VAL
npy = NPY_VAL
npz = NPZ_VAL
[physics]
rayleigh = 1.0e9
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 150.0
dt_max = 0.001
max_cfl = 1.0
max_step = 60
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e9_box_speed/"
monitor_interval = 10
stats_start_time = 1.0e9
stats_interval = 25.0
checkpoint_interval = 1000000000
checkpoint_dir = "restart_1e9_box_speed"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 0
