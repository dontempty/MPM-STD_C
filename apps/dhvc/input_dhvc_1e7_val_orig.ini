# 최적화 전/후 통계 검증 덱 (2026-10-18)
# 최적화 전/후 통계 검증 덱 (2026-10-18) — 원본 덱에서 npz 4·출력 경로만 바꿈
# DHVC fig7 Ra=1e7 — MPM-STD_C input_fig7_gpu_1e7 1:1 (OB). 1e6 restart 격자보간 warm-start.
[mesh]
nx = 832
ny = 416
nz = 192
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 4
[physics]
rayleigh = 1.0e7
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 200.0
dt_max = 0.005
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_val_1e7_orig/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 25.0
checkpoint_interval = 20000
checkpoint_dir = "restart_val_1e7_orig"
stats_sample_interval = 5
conditional_interval = 5
spectra_interval = 100
