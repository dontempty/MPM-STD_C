# DHVC 1e10 4×1×1 상자 2구간 (2026-10-26) — 1구간(잡 947396)이 2일 한도로 끝난 뒤 최신 체크포인트에서 정확한 재시작(restart_from).
# 통계는 t ≥ 100 이면 재시작 직후부터 새로 누적 → out_1e10_box_seg2/ (구간 파일은 후처리에서 dt 가중 합산, plot/build_plot_1e9.py 방식).
# 제출: sbatch --dependency=afterany:<1구간 잡> ... DECK=input_dhvc_1e10_box_cont.ini NAME=box1e10_seg2 WARMSTART_DIR=restart_1e10_box
[mesh]
nx = 3200
ny = 366
nz = 3200
[domain]
lx = 4.0
ly = 1.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = NPX_VAL
npy = NPY_VAL
npz = NPZ_VAL
[physics]
rayleigh = 1.0e10
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 1000.0        ; 2일 한도까지 돌리고 체크포인트로 이어 간다 (8장 ≈ 0.53 s/step → 한 잡에 약 60 time)
dt_max = 0.0005
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = ""
restart_from = "WARMSTART_BIN"   ; 잡 스크립트가 restart_1e10_box 의 최신 체크포인트로 치환
[output]
stats_dir = "out_1e10_box_seg2/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 25.0
checkpoint_interval = 30000   ; ≈ 4.4 h 마다 (150 GB)
checkpoint_dir = "restart_1e10_box"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 1000
