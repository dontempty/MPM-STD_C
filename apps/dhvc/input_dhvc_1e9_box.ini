# DHVC Ra=1e9 축소 상자 (2026-10-20) — 해상도는 input_dhvc_1e9.ini 와 같고 x(연직)·y(스팬)만 절반:
#   8×4×1 → 4×2×1, 3200×664×1600 → 1600×332×1600 (8.5억 셀, Δx·Δy·z 스트레칭 동일).
#   z(벽 간격)는 Ra 의 기준 길이(ν = √(Pr/Ra), lz = 1)라 줄이지 않는다 — 줄이면 실효 Ra 가 1/8.
# 1e7 체크포인트(8×4 상자) 격자보간 warm-start: 보간은 원본을 대상 상자에 늘려 맞추므로 x·y 로 1/2 압축된 장이 초기조건(주기 이음매 없음).
# 분할은 잡 스크립트가 DECOMP 로 치환 (NPX_VAL·NPY_VAL·NPZ_VAL).
[mesh]
nx = 1600
ny = 332
nz = 1600
[domain]
lx = 4.0
ly = 2.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = NPX_VAL
npy = NPY_VAL
npz = NPZ_VAL
[physics]
rayleigh = 1.0e9
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 150.0
dt_max = 0.001
max_cfl = 1.0
max_step = 0
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e9_box/"
monitor_interval = 100
stats_start_time = 100.0
stats_interval = 25.0
checkpoint_interval = 50000
checkpoint_dir = "restart_1e9_box"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 1000
