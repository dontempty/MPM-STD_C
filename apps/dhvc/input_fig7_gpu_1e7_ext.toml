# DHVC GPU — Ra=1e7, paper DNS grid (Kim et al. 2023 Table 1: Nx×Ny×Nz=832×192×416,
# Ny=wall-normal, Nz=span → our n1m×n2m×n3m = 832×416×192, z=wall). 4×A100 / 2 nodes
# (np 1×1×4). Warm-start from the developed 1e6 t=240 field (cross-mesh interp).
[domain]
Lx = 8.0
Ly = 4.0
Lz = 1.0
[mesh]
n1m = 832
n2m = 416
n3m = 192
[mpi]
np1 = 1
np2 = 1
np3 = 2
[uniform_mesh]
uniform1 = 1
uniform2 = 1
uniform3 = 0
[mesh_stretch]
gamma1 = 0.0
gamma2 = 0.0
gamma3 = 2.6
[physics]
Ra = 1.0e7
Pr = 0.7
[topology]
x = "periodic"
y = "periodic"
z = "wall"
[bc.z.minus]
T = 0.5
[bc.z.plus]
T = -0.5
[time]
t_start  = 0.0
t_end    = 240.0
dt_start = 0.005
MaxCFL   = 1.0
n_steps  = 250000
[init]
perturb = 0.05
[output]
dir_stats   = "apps/dhvc/out_1e7_ext/"
nmonitor    = 50
t_stat_start = 40.0
nstat        = 10
t_stat_out   = 20.0
[restart]
dir_in  = "apps/dhvc/restart_1e7/"
dir_out = "apps/dhvc/restart_1e7b/"
