# DHVC Ra=1e8 div-stability check — warm-start from restart_1e7_t240 (cross-mesh
# 832x416x192 -> 1536x340x768), SHORT window to confirm div does not blow up after
# the pressure changes (dP̂ extrapolation + halo sync). NOT a production run:
# n_steps small, dir_out empty (does NOT overwrite restart_1e8_t150).
[domain]
Lx = 8.0
Ly = 4.0
Lz = 1.0
[mesh]
n1m = 1536
n2m = 340
n3m = 768
[mpi]
np1 = 1
np2 = 1
np3 = 4
[uniform_mesh]
uniform1 = 1
uniform2 = 1
uniform3 = 0
[mesh_stretch]
gamma1 = 0.0
gamma2 = 0.0
gamma3 = 2.6
[physics]
Ra = 1.0e8
Pr = 0.7
[topology]
x = "periodic"
y = "periodic"
z = "wall"
[bc.z.minus]
T = 0.5
[bc.z.plus]
T = -0.5
[time]
t_start  = 0.0
t_end    = 200.0
dt_start = 0.002
MaxCFL   = 0.4
n_steps  = 3000
[init]
perturb = 0.05
[output]
dir_stats    = "apps/dhvc/divcheck_1e8_out/"
nmonitor     = 100
t_stat_start = 1000.0
nstat        = 10
t_stat_out   = 1000.0
[restart]
dir_in       = "apps/dhvc/restart_1e7_t240"
dir_out      = ""
warmstart_io = "slab"
