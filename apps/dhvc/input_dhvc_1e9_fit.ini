# DHVC 1e9 본 격자 적재 시험 — 20 스텝, 통계·체크포인트 없음 (2026-10-20).
[mesh]
nx = 3200
ny = 664
nz = 1600
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = NPZ_VAL
[physics]
rayleigh = 1.0e9
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 150.0
dt_max = 0.001
max_cfl = 1.0
max_step = 20
[initial]
perturb = 0.05
warmstart_from = "WARMSTART_BIN"
[output]
stats_dir = "out_1e9_fit/"
monitor_interval = 5
stats_start_time = 1.0e9
stats_interval = 25.0
checkpoint_interval = 1000000000
checkpoint_dir = "restart_1e9_fit"
stats_sample_interval = 20
conditional_interval = 20
spectra_interval = 1000
