# 확장성 측정 덱 (tools/scale/gen_decks.py 생성) — dhvc strong 256³ np 4; 기반 input_dhvc_1e5.ini
# DHVC fig7 Ra=1e5 — MPM-STD_C apps/dhvc/input_fig7_gpu_1e5.toml 1:1 (OB, 냉시작)
[mesh]
nx = 256
ny = 256
nz = 256
[domain]
lx = 8.0
ly = 4.0
lz = 1.0
[stretch]
uniform_z = false
gamma_z = 2.6
[process]
npx = 1
npy = 1
npz = 4
[physics]
rayleigh = 1.0e5
prandtl = 0.7
delta_temperature = 0.0
gravity_axis = 0
[time]
end_time = 1.0e9
dt_max = 0.02
max_cfl = 0.4
max_step = 200
[initial]
perturb = 0.05
[output]
stats_dir = "scale/out_tmp/"
monitor_interval = 50
stats_start_time = 1.0e9
stats_interval = 0
checkpoint_interval = 0
checkpoint_dir = "restart_1e5"
stats_sample_interval = 1   ; 확장 통계 표본 간격(스텝) — 1e5·1e6 은 매 스텝
conditional_interval = 0
spectra_interval = 0
