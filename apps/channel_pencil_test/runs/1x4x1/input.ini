; channel_pencil_test 기본 덱 — 압력 펜슬 분할 검증 (2026-10-20). 작은 채널, 30 스텝, 같은 IC.
; nx 36·ny 30 은 일부러 4 로 안 나누어떨어지게 (펜슬 조각·x 모드 조각 불균등 분할도 시험).
; [process] 와 출력 경로는 run_compare.sh 가 케이스마다 바꾼다.
[mesh]
nx = 36
ny = 30
nz = 32

[domain]
lx = 6.283185307179586
ly = 3.141592653589793
lz = 2.0

[stretch]
uniform_z = false
gamma_z = 3.0

[process]
npx = 1
npy = 4
npz = 1

[physics]
reynolds_bulk = 2857.0

[boundary]
velocity_ghost = mirror

[time]
dt_max = 0.02
max_cfl = 0.5
max_step = 30

[initial]
pert_amp = 0.5

[output]
stats_dir = "runs/1x4x1/stats/"
monitor_interval = 5
stats_start_step = 1000000
checkpoint_interval = 30
checkpoint_dir = "runs/1x4x1/checkpoints"
