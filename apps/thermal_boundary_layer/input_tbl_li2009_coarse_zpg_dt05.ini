# dt 절반 (CFL 0.4) — isoflux 벽 θ_rms 의 시간해상도 민감도 (2026-10-12)
# ZPG 수정판 (2026-10-12): 상단 w = U∞ dδ*/dx 를 트립 모드에서도 갱신(이전엔 recycling 만 → 층류 Blasius 값 고정으로 자유류 +2% 가속)
# 격자 민감도: 논문 명목 간격(Δx⁺ 17, Δy⁺ 7)을 2차 FD 로 — 본런(Δx⁺ 11, Δy⁺ 5)과 비교 (2026-10-11)
# 열 경계층 검증 — Li, Schlatter, Brandt & Henningson (2009) IJHFF 30, 916 와 같은 조건 (2026-10-11)
#   Re_δ*₀ = 450 (층류 Blasius 유입, 단위길이 δ*₀), 상자 750 × 34(스팬) × 40(높이) δ*₀, 트립 x=10,
#   Re_θ 175 → ~830, Pr 0.2/0.71/2.0, isoscalar(θ_w=0)·isoflux(∂θ/∂z|w=1), 자유류 θ=1.
#   논문 격자(스펙트럴) 1024×289×128 (Δx⁺ 17, Δz⁺ 6.3 @Re_θ 400). 우리(2차 FD): 1600×160×192 →
#   Δx⁺ ≈ 11, Δy⁺(스팬) ≈ 5, z⁺₁ ≈ 0.4 (= 통과한 re4500 DNS 해상도), δ99(Re_θ 830) 안 ~130 셀.
#   스칼라 5종 = 논문 θ1..θ5 (Pr 0.2 iso, 0.71 iso, 0.71 flux, 2.0 iso, 2.0 flux).
[mesh]
nx = 1024
ny = 112
nz = 144

[domain]
lx = 750.0
ly = 34.0
lz = 40.0

[stretch]
uniform_z = false
gamma_z = 2.5

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 450.0

[inflow]
method = blasius
relaxation_time = 50.0

[trip]
amplitude = 0.04          ; Δw ≈ A ℓ_x/U∞ ≈ 0.16 (Schlatter & Örlü 2012 식; 논문도 x=10 랜덤 체적력)
x_center = 10.0
length_x = 4.0
length_z = 1.0
time_scale = 4.0
modes = 10
end_time = 0

[scalars]
prandtl = "0.2, 0.71, 0.71, 2.0, 2.0"
wall = "isoscalar, isoscalar, isoflux, isoscalar, isoflux"
theta_infinity = 1
wall_value = 0
wall_gradient = 1

[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = blasius
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream

[initial]
profile = blasius

[time]
end_time = 9000.0        ; 과도 2250 (3 통과) + 통계 6750 (9 통과; 논문 12000)
dt_max = 0.1
max_cfl = 0.4

[output]
stats_dir = "stats/li2009_coarse_zpg_dt05/"
monitor_interval = 500
stats_start_time = 2250.0
stats_interval = 750.0
stations = "390, 620, 830"    ; 논문 fig.7 속도 / fig.8-10 스칼라(830)
checkpoint_interval = 40000
checkpoint_dir = "checkpoints/li2009_coarse_zpg_dt05"
