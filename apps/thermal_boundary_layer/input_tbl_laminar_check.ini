# 열 경계층 앱 스모크 + 층류 검증 — 트립 없음(층류 유지), St(x) 를 Pohlhausen/등열속 상사해와 비교 (2026-10-11)
# 단위: δ*₀ (Re_δ*₀ 450). 스칼라 3종: Pr 0.71 isoscalar, Pr 0.71 isoflux, Pr 2.0 isoscalar
[mesh]
nx = 192
ny = 4
nz = 64

[domain]
lx = 100.0
ly = 2.0
lz = 12.0

[stretch]
uniform_z = false
gamma_z = 2.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 450.0

[inflow]
method = blasius
relaxation_time = 20.0

[trip]
amplitude = 0

[scalars]
prandtl = "0.71, 0.71, 2.0"
wall = "isoscalar, isoflux, isoscalar"
theta_infinity = 1
wall_value = 0
wall_gradient = 1

[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = blasius
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream

[initial]
profile = blasius

[time]
end_time = 150.0
dt_max = 0.2
max_cfl = 0.8

[output]
stats_dir = "stats/laminar_check/"
monitor_interval = 200
stats_start_time = 100.0
stats_interval = 50.0
stations = "300"
checkpoint_interval = 0
