# de Vahl Davis (1983) 차등가열 정방 공동, Ra = 1e3, Pr = 0.71 — 2D (ny = 1 축 붕괴).
# 벤치마크 Nu_avg: 1e3 1.118 / 1e4 2.243 / 1e5 4.519 / 1e6 8.800 (u_max, w_max 는 README)
# 무차원은 자유낙하 스케일 (nu = sqrt(Pr/Ra), alpha = 1/sqrt(Ra Pr)); 확산 시간 = sqrt(Ra Pr).

[mesh]
nx = 128
ny = 1
nz = 128

[domain]
lx = 1.0
ly = 0.0078125
lz = 1.0

[stretch]
uniform_z = true

[process]
npx = 1
npy = 1
npz = 1

[physics]
rayleigh = 7100
prandtl = 0.71
delta_temperature = 0
gravity_axis = 2

[boundary]
x = wall
y = periodic
z = wall
velocity_ghost = mirror
t_x_minus = adiabatic
t_x_plus = adiabatic
t_z_minus = adiabatic
t_z_plus = adiabatic
u_z_plus = 1.0

[initial]
perturb = 0

[time]
end_time = 40
dt_max = 0.5
max_cfl = 0.5
max_step = 8000

[output]
stats_dir = "stats/lid_re100_mirror/"
monitor_interval = 1000
stats_start_time = 0
stats_interval = 50
