; ΔT=40 K 윗벽 rms 스파이크 dt 스터디 (visc24 임계 스캔) — 2026-10-09
; dt40 본런(냉시작, CFL 0.3, t=25000) 체크포인트에서 warm restart. 확장 통계(Horn 2013 전 항목) 누적.
; base: CFL dt(≈0.012, D_×≈39) 그대로 / visc12·visc6: dt ≤ C_v·Δ_h·Δz_wall/(C_μ μ̂_max) (C_v = 12·6 → dt ≈ 3.6e-3·1.8e-3)
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05
restart_from = "checkpoints/rbc_nob_ck_02005764.bin"

[time]
end_time = 25100.0
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 24

[output]
checkpoint_interval = 0
checkpoint_dir   = "checkpoints_dt40_visc24/"
stats_dir        = "stats_nob_dt40_visc24/"
monitor_interval = 200
stats_start_time = 25050.0
stats_interval   = 50.0
stats_sample_interval = 5
