; 가변물성 경로의 정확 OB 극한(ΔT = 0, 모든 물성 ≡ 1) — NOB fig9 본런 덱과 같은 프로토콜로 냉시작(→ t 27000, 통계 16900~, 표본 5스텝).
; 같은 커널·같은 격자·같은 CFL 에서 물성만 상수: NOB 윗벽 rms 스파이크와 rbc_ob(상수 커널) 의 삼각 대조 (2026-10-14).
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05

[time]
end_time = 27000.0
dt_max = 0.05
max_cfl = 0.3

[output]
checkpoint_interval = 50000
checkpoint_dir   = "checkpoints_ob_limit_cold/"
stats_dir        = "stats_nob_ob_limit_cold/"
monitor_interval = 1000
stats_start_time = 16900.0
stats_interval   = 1000.0
stats_sample_interval = 5
