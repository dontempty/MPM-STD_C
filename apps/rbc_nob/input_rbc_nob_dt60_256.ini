; fig9 재현 본런 — MPM-STD_C input_p7_deltat40_z256_cold_cfl03.toml 1:1
; (128x128x256, 6x6x1, Ra 1e6, Pr 2547(글리세롤), dT 40K, 냉시작, CFL 0.3)
; 참조 판정: theta_c = 0.1383 (t 16900~25000 창; Horn +0.05%)
[mesh]
nx = 256
ny = 256
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 60.0

[initial]
perturb = 0.05

[time]
end_time = 25000.0
dt_max = 0.05
max_cfl = 0.3

[output]
# 재시작 체크포인트 (M11): 50000 스텝마다, 최신 2개 유지 (~168MB/개).
# 재시작: [initial] restart_from = "checkpoints/rbc_nob_ck_<step>.bin"
checkpoint_interval = 50000
checkpoint_dir = "checkpoints_dt60_256"
stats_dir = "stats_nob_dt60_256/"
monitor_interval = 1000
stats_start_time = 2500.0
stats_interval   = 1000.0
