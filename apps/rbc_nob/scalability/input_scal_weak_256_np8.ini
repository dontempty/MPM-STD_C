; 확장성 벤치마크 weak — 전역 256x256x2048, npz 8 (gen_decks.sh 생성; docs/Scalability/plan.md)
[mesh]
nx = 256
ny = 256
nz = 2048

[domain]
lx = 6.0
ly = 6.0
lz = 8.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 8

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[time]
end_time = 1.0e9
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
stats_dir = "out/scal_weak_256_np8/"
monitor_interval = 50
stats_start_time = 1.0e9
checkpoint_interval = 0
phase_timing_start_step = 50
