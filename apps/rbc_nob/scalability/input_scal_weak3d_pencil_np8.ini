# weak 3-D (2026-10-20): GPU 당 256³ 블록, 전체 512×512×512, pencil 2x2x2
; 확장성 벤치마크 strong — 전역 256x256x256, npz 1 (gen_decks.sh 생성; docs/Scalability/plan.md)
[mesh]
nx = 512
ny = 512
nz = 512

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npx = 2
npy = 2
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 40.0

[initial]
perturb = 0.05

[time]
end_time = 1.0e9
max_step = 200
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 12

[output]
stats_dir = "out/scal_weak3d_pencil_np8/"
monitor_interval = 50
stats_start_time = 1.0e9
checkpoint_interval = 0
phase_timing_start_step = 50
