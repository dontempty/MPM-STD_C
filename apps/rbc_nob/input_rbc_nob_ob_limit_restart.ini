; 가변물성 경로의 **정확 OB 극한**(ΔT = 0 → 모든 물성 ≡ 1) — NOB ΔT 40 스파이크 상태(t 25000, CFL dt, D_×≈40)
; 체크포인트에서 warm restart. 물성만 상수로 바뀌면 윗벽 스파이크가 죽는지(가변 μ̂ 원인) 유지되는지(경로 원인) 판정.
; dt_max 0.05 → μ̂=1 에서 D_× = C_μ dt/(Δ_h Δz_wall) = 35 (임계 ~40 바로 아래). (2026-10-13)
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05
restart_from = "checkpoints/rbc_nob_ck_02005764.bin"

[time]
end_time = 25600.0
dt_max = 0.05
max_cfl = 0.3

[output]
checkpoint_interval = 0
stats_dir        = "stats_nob_ob_limit_restart/"
monitor_interval = 200
stats_start_time = 25100.0
stats_interval   = 250.0
stats_sample_interval = 5
