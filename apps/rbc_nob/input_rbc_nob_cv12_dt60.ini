; NOB 글리세롤 ΔT 60 K 냉시작 본런 — **viscous_coupling_number = 12**(윗벽 D_× ≤ 12, 10-09 dt 기준) 캠페인 (2026-10-14).
; 나머지는 fig9 본런 덱(input_rbc_nob_dt40.ini)과 동일: 128×128×256, 6×6×1, γ_z 2.6, Ra 1e6, Pr 2547, CFL 0.3, dt_max 0.05,
; 냉시작 → t 25000, 통계 16900 부터 1000 간격(표본 5 스텝; Horn 2013 전 항목 + 시간평균 T·W 장 → Re_pl, 시간평균 T PDF).
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 60.0

[initial]
perturb = 0.05

[time]
end_time = 25000.0
dt_max = 0.05
max_cfl = 0.3
# 윗벽 rms 스파이크 방지 (docs/Design/20261009_rbc_nob_dt_criterion.md): dt <= C_v*dh*dz/(Cmu*mu_max), 임계 D_x~40 의 0.3배
viscous_coupling_number = 12

[output]
# 재시작 체크포인트 (M11): 50000 스텝마다, 최신 2개 유지 (~168MB/개).
# 재시작: [initial] restart_from = "checkpoints/rbc_nob_ck_<step>.bin"
checkpoint_interval = 50000
checkpoint_dir   = "checkpoints_cv12_dt60/"
stats_dir        = "stats_nob_cv12_dt60/"
monitor_interval = 1000
stats_start_time = 16900.0
stats_interval   = 1000.0
stats_sample_interval = 5
