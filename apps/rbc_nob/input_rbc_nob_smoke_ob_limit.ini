; ΔT = 0 정확 OB 극한 스모크 (smoke_ext 와 동일, 물성만 상수) — 2026-10-13
; NOB 글리세롤 스모크 — 작은 격자, 배선·안정성 확인용 (물리 수렴 아님)
[mesh]
nx = 32
ny = 32
nz = 32

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05

[time]
end_time = 20.0
dt_max = 0.05
max_cfl = 0.3
viscous_coupling_number = 6

[output]
stats_dir        = "stats_nob_smoke_ob_limit/"
monitor_interval = 50
stats_start_time = 10.0
stats_interval   = 5.0
stats_sample_interval = 2
