; 가변물성 경로의 정확 OB 극한(ΔT = 0) — 냉시작, rbc 앱 OB 런(input_rbc_ob_pr2547_z256.ini)과 같은 조건·창.
; 상수물성 커널(rbc) vs 가변물성 커널(μ̂≡1) 의 윗벽 rms 비교 (2026-10-13).
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z = 2.6

[process]
npz = 2

[physics]
rayleigh = 1.0e6
prandtl = 2547.0
delta_temperature = 0

[initial]
perturb = 0.05

[time]
end_time = 5000.0
dt_max = 0.05
max_cfl = 0.3

[output]
checkpoint_interval = 0
stats_dir        = "stats_nob_ob_limit_cold/"
monitor_interval = 1000
stats_start_time = 3000.0
stats_interval   = 500.0
stats_sample_interval = 5
