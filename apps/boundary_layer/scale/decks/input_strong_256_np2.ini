# 확장성 측정 덱 (tools/scale/gen_decks.py 생성) — boundary_layer strong 256³ np 2; 기반 input_bl_blasius_coarse.ini
# 단계 A: 2D 층류 ZPG 경계층 — Blasius 상사해 검증 (ny = 1 축 붕괴).
# 유입 Re_δ*₀ = 450 (x₀ = 152 δ*₀), Lx = 600 → 출구 Re_x ≈ 3.4e5 (층류 유지).
# 비교: C_f = 0.664/√Re_x, δ* = 1.7208√(νx/U∞), θ = 0.66412√(νx/U∞), H = 2.591.

[mesh]
nx = 256
ny = 256
nz = 256

[domain]
lx = 600.0
ly = 20.0
lz = 40.0

[stretch]
uniform_z = false
gamma_z = 2.5        ; 한쪽(벽) tanh — 첫 셀 0.016, 유입 δ99 안에 ~48 셀

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 450.0            ; Re_δ*₀ (단위길이 = δ*₀)

[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = blasius
u_z_plus = slip          ; 자유류: ∂u/∂z = 0
v_z_plus = slip
w_z_plus = freestream    ; 자유류: w = Blasius w∞(x) = 0.8604 U∞/√Re_x (앱이 공급)
                         ; ⚠ continuity 는 유입 상단 w 가 이류돼 과다 유출 → 자유류 감속(θ +55%) — 2026-10-06 실측

[initial]
profile = blasius

[time]
end_time = 1.0e9
dt_max = 0.5
max_cfl = 0.8

max_step = 200
[output]
stats_dir = "scale/out_tmp/"
monitor_interval = 50
stats_interval = 1.0e9

checkpoint_interval = 0