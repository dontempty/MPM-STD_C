# 단계 B 난류 ZPG 경계층 — 케이스 B: 재순환 유입 Re_δ99,in = 6000 (Re_θ,in ≈ 6000/7.5), 스테이션 1000,1100.
# 단위길이 = δ99,in. 격자 Δx⁺≈10~13, Δy⁺≈5, z⁺₁≈0.4 (한쪽 tanh γ 2.5), Lz = 6 ≈ 4 δ99(out).
# 유입 뒤 300 θ(≈40 δ99,in) 는 버린다 (Simens 2009). 참조: Schlatter & Örlü 2010 / Torroja 1100.
[mesh]
nx = 2560
ny = 224
nz = 192

[domain]
lx = 100.0
ly = 5.0
lz = 6.0

[stretch]
uniform_z = false
gamma_z = 2.5

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 6000.0

[inflow]
method = recycling
recycle_x = 80.0
delta99 = 1.0
relaxation_time = 20.0
noise = 0.1

[trip]
amplitude = 0.05          ; 난류 트립 체적력 A (Δw ≈ A·ℓ_x/U∞ ≈ 0.2 U∞). 0 = 끔. 백색 섭동 IC 만으로는 층류화(2026-10-08 실측)
x_center = 8.0            ; 유입면 뒤 8 δ*₀
length_x = 4.0
length_z = 0.8
time_scale = 4.0
modes = 10
end_time = 0              ; 끝까지 켜 둠 (KTH 참조 DNS 와 같음) — 통계 스테이션은 x ≥ 40 이라 영향권 밖
[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = recycling
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream

[initial]
profile = uniform

[time]
end_time = 1300.0        ; 13 통과 (전이 3 + 통계 10)
dt_max = 0.05
max_cfl = 0.8

[output]
stats_dir = "stats/re6000/"
monitor_interval = 500
stats_start_time = 300.0
stats_interval = 100.0
stations = "1000,1100"
checkpoint_interval = 20000
checkpoint_dir = "checkpoints/re6000"
