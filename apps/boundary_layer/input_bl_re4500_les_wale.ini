# 경계층 LES 검증 — re4500 DNS 와 같은 상자·유입·트립, 격자만 성기게 (WALE C_w 0.5) (2026-10-11)
# DNS 2048x192x192 (Δx⁺≈11, Δy⁺≈5, z⁺₁≈0.4) → LES 768x64x96 (Δx⁺≈30, Δy⁺≈16, z⁺₁≈0.8): 셀 수 1/16.
# 참조: KTH DNS (Schlatter & Örlü 2010) · KTH LES (Schlatter et al. 2010 IJHFF, Δx⁺ 25 Δz⁺ 11) · Torroja (Re_θ 1100/1551).
[mesh]
nx = 768
ny = 64
nz = 96

[domain]
lx = 100.0
ly = 5.0
lz = 6.0

[stretch]
uniform_z = false
gamma_z = 2.5

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 4500.0

[inflow]
method = recycling
recycle_x = 80.0
delta99 = 1.0
relaxation_time = 20.0
noise = 0.1

[trip]
amplitude = 0.01          ; 난류 트립 체적력 A. 0.05 는 벽 근처 저속 유체에 Δw≈2 를 만들어 dt 가 0.038→0.007 로 5배 감소(2026-10-08) → 0.01
x_center = 8.0            ; 유입면 뒤 8 δ*₀
length_x = 4.0
length_z = 0.8
time_scale = 4.0
modes = 10
end_time = 0              ; 끝까지 켜 둠 (KTH 참조 DNS 와 같음) — 통계 스테이션은 x ≥ 40 이라 영향권 밖
[les]
model = wale
c_s = 0.12
c_w = 0.5

[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = recycling
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream

[initial]
profile = blasius          ; 냉시작 (유입 잡음 + 트립으로 전이)

[time]
end_time = 1700.0        ; 냉시작 전이·재조정 ~500 + 통계 1200
dt_max = 0.05
max_cfl = 0.8

[output]
stats_dir = "stats/re4500_les_wale/"
monitor_interval = 500
stats_start_time = 500.0  ; 냉시작 전이·재순환 재조정 구간을 버림
stats_interval = 100.0
stations = "1000,1410,1551"       ; 프로파일 스테이션 — 트립(x_t 8) 영향권(x ≲ 30) 밖만: KTH 1000·1410, Torroja 1100·1551·1968
checkpoint_interval = 40000
checkpoint_dir = "checkpoints/re4500_les_wale"
