# 단계 B 작동 확인용 소형 3D (CPU): 재순환-재스케일 유입. 물리 검증 아님 (격자 거침).
# 단위길이 = 유입 δ99,in = 1, Re_δ99 = 2000 (Re_θ ≈ 250 급 — 저Re 라 난류 유지 불확실, 작동만 확인)

[mesh]
nx = 192
ny = 32
nz = 64

[domain]
lx = 30.0
ly = 3.0
lz = 6.0

[stretch]
uniform_z = false
gamma_z = 2.0

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 2000.0        ; Re_δ99,in

[inflow]
method = recycling
recycle_x = 22.0         ; 재순환면 (0.73 Lx)
delta99 = 1.0
relaxation_time = 20.0
noise = 0.1

[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = recycling
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream    ; 단계 ② 전까지 w_top = 0

[initial]
profile = uniform

[time]
end_time = 60.0
dt_max = 0.05
max_cfl = 0.8

[output]
stats_dir = "stats/recycling_cpu/"
monitor_interval = 100
