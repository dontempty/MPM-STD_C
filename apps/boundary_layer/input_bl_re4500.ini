# 단계 B 난류 ZPG 경계층 — 케이스 A: 재순환 유입 Re_δ99,in = 4500 (Re_θ,in ≈ 4500/7.5), 스테이션 670,1000.
# 단위길이 = δ99,in. 격자 Δx⁺≈10~13, Δy⁺≈5, z⁺₁≈0.4 (한쪽 tanh γ 2.5), Lz = 6 ≈ 4 δ99(out).
# 유입 뒤 300 θ(≈40 δ99,in) 는 버린다 (Simens 2009). 참조: Schlatter & Örlü 2010 / Torroja 1100.
[mesh]
nx = 2048
ny = 192
nz = 192

[domain]
lx = 100.0
ly = 5.0
lz = 6.0

[stretch]
uniform_z = false
gamma_z = 2.5

[process]
npx = 1
npy = 1
npz = 2

[physics]
u_infinity = 1.0
reynolds = 4500.0

[inflow]
method = recycling
recycle_x = 80.0
delta99 = 1.0
relaxation_time = 20.0
noise = 0.1

[trip]
amplitude = 0.01          ; 난류 트립 체적력 A. 0.05 는 벽 근처 저속 유체에 Δw≈2 를 만들어 dt 가 0.038→0.007 로 5배 감소(2026-10-08) → 0.01
x_center = 8.0            ; 유입면 뒤 8 δ*₀
length_x = 4.0
length_z = 0.8
time_scale = 4.0
modes = 10
end_time = 0              ; 끝까지 켜 둠 (KTH 참조 DNS 와 같음) — 통계 스테이션은 x ≥ 40 이라 영향권 밖
[boundary]
x = inflow_outflow
y = periodic
z = wall
velocity_ghost = mirror
inflow_profile = recycling
u_z_plus = slip
v_z_plus = slip
w_z_plus = freestream

[initial]
restart_from = "checkpoints/re4500/bl_ck_00020000.bin"   ; 2026-10-08 자유류 정규화 수정판으로 재시작
profile = uniform

[time]
end_time = 1500.0        ; 재시작(t≈200) + 재조정 ~2 통과 + 통계 10 통과
dt_max = 0.05
max_cfl = 0.8

[output]
stats_dir = "stats/re4500/"
monitor_interval = 500
stats_start_time = 500.0  ; 자유류 정규화 재시작 뒤 재조정 구간을 버림
stats_interval = 100.0
stations = "670,1000"
checkpoint_interval = 20000
checkpoint_dir = "checkpoints/re4500"
