# Run B — top/bottom symmetry diagnostic: identical to input_reorder_cold_dt20.toml
# EXCEPT the walls are swapped (bottom cold / top hot) AND gravity is flipped
# (gravity_sign = -1), giving the exact z-mirror image of the baseline — a
# convecting run whose hot wall is now at the top. dt_start stays 0.05.
#   If the u/v/w rms spike stays at the geometric top (z+) -> z+ boundary code bug.
#   If it moves to the bottom (following the physics/mirror) -> not a code bug.
[domain]
Lx = 6.0
Ly = 6.0
Lz = 1.0
[mesh]
n1m = 128
n2m = 128
n3m = 256
[mpi]
np1 = 1
np2 = 1
np3 = 2
[uniform_mesh]
uniform1 = 1
uniform2 = 1
uniform3 = 0
[mesh_stretch]
gamma1 = 0.0
gamma2 = 0.0
gamma3 = 2.6
[physics]
Ra = 1.0e6
Pr = 2547.0
nob = 1
DeltaT = 20.0
gravity_sign = -1.0
[topology]
x = "periodic"
y = "periodic"
z = "wall"
[bc.z.minus]
T = -0.5
ghost = "antisymmetric"
ghost_uv = "zero"
[bc.z.plus]
T = 0.5
ghost = "antisymmetric"
ghost_uv = "zero"
[time]
t_start  = 0.0
t_end    = 15000.0
dt_start = 0.05
MaxCFL   = 0.3
n_steps  = 8000000
[init]
perturb = 0.05
[output]
dir_stats   = "apps/rbc/reorder_cold_dt20_flip/"
nmonitor    = 100
t_stat_start = 7500.0
t_stat_out   = 2500.0
[restart]
dir_out = "apps/rbc/restart_reorder_cold_dt20_flip/"
nrestart_write = 100000
