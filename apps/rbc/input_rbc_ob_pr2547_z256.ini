; OB(상수물성 커널, apps/rbc) 대조 런 — NOB fig9 본런 덱(apps/rbc_nob/input_rbc_nob_dt40.ini)과 **같은 조건**에서 물성만 상수:
;   128×128×256, 6×6×1, γ_z 2.6, Ra 1e6, Pr 2547(글리세롤), perturb 0.05, 냉시작, CFL 0.3, dt_max 0.05, 통계 16900 부터 1000 간격.
;   종료만 25000 → 27000 으로 늘려 NOB base 확장통계 창(25300~27000)과도 겹친다.
; 목적: NOB 경로에서 본 윗벽(차가운 벽) 속도 rms 스파이크가 OB 경로(가변물성 커널·블록 교차응력 없음)에서도 나는지 (2026-10-13).
; 비교: stats_nob_dt40 (NOB 냉시작 16900~25000), stats_nob_dt40_base (NOB CFL dt, 스파이크), stats_nob_dt40_visc12 (NOB dt 제한, 스파이크 없음).
[mesh]
nx = 128
ny = 128
nz = 256

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z   = 2.6

[process]
npx = 1
npy = 1
npz = 2

[physics]
rayleigh          = 1.0e6
prandtl           = 2547.0
delta_temperature = 0
gravity_axis      = 2

[initial]
perturb = 0.05

[time]
end_time = 27000.0
dt_max   = 0.05
max_cfl  = 0.3
max_step = 0

[output]
stats_dir        = "stats_rbc_ob_pr2547_z256/"
monitor_interval = 1000
stats_start_time = 16900.0
stats_interval   = 1000.0
