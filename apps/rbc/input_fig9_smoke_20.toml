# Fig9 NOB smoke test (ΔT=20K glycerol) — SHORT run to validate the dP̂
# extrapolation fix (PaScaL_TCS §820-821). Same physics as input_fig9_gpu_nob_20_x,
# only n_steps/nstat/monitor reduced. NOT a convergence run.
[domain]
Lx = 6.0
Ly = 6.0
Lz = 1.0
[mesh]
n1m = 128
n2m = 128
n3m = 128
[mpi]
np1 = 1
np2 = 1
np3 = 2
[uniform_mesh]
uniform1 = 1
uniform2 = 1
uniform3 = 0
[mesh_stretch]
gamma1 = 0.0
gamma2 = 0.0
gamma3 = 2.6
[physics]
Ra = 1.0e6
Pr = 2547.0
nob = 1
DeltaT = 20.0
[topology]
x = "periodic"
y = "periodic"
z = "wall"
[bc.z.minus]
T = 0.5
ghost = "antisymmetric"
[bc.z.plus]
T = -0.5
ghost = "antisymmetric"
[time]
t_start  = 0.0
t_end    = 1000000.0
dt_start = 0.02
MaxCFL   = 0.3
n_steps  = 3000
[init]
perturb = 0.05
[output]
dir_stats   = "apps/rbc/fig9_smoke_out_20/"
nmonitor    = 200
nstat_start = 500
[restart]
dir_in  = ""
dir_out = ""
