; 진단(2026-10-13): 상수물성 경로의 벽 거동 — 작은 격자, Pr 0.7, dt_max 0.05. 벽 인접 u_h,rms·w_rms 멱지수로 무활주/미끄럼 판정.
[mesh]
nx = 48
ny = 48
nz = 96

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z   = 2.6

[process]
npz = 2

[physics]
rayleigh          = 1.0e6
prandtl           = 0.7
delta_temperature = 0
gravity_axis      = 2

[initial]
perturb = 0.05

[time]
end_time = 400.0
dt_max   = 0.05
max_cfl  = 0.3

[output]
stats_dir        = "stats_rbc_diag_const_pr07/"
monitor_interval = 1000
stats_start_time = 200.0
stats_interval   = 200.0
