; CPU/GPU 스모크용 미니 RBC — 조건 꼴은 ra1e6 과 같고 크기·시간만 축소.

[mesh]
nx = 32
ny = 32
nz = 32

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z   = 2.6

[process]
npx = 1
npy = 1
npz = 2

[physics]
rayleigh          = 1.0e6
prandtl           = 0.7
delta_temperature = 0
gravity_axis      = 2

[initial]
perturb = 0.02

[time]
end_time = 10.0
dt_max   = 0.05
max_cfl  = 0.3
max_step = 0

[output]
stats_dir        = "stats_rbc_smoke/"
monitor_interval = 50
stats_start_time = 5.0
stats_interval   = 5.0
