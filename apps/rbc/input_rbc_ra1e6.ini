; MPM-STD RBC — OB 검증 케이스: Ra = 1e6, Pr = 0.7, 6×6×1 (Γ = 6)
; 문헌 벤치마크: Kerr (1996) — Nu ≈ 8.3 부근 (주기 6×6, 공기 Pr)
; NOB(글리세롤 ΔT>0) 케이스는 NOB 마일스톤에서 — 지금 delta_temperature 는 0.

[mesh]
nx = 128
ny = 128
nz = 64

[domain]
lx = 6.0
ly = 6.0
lz = 1.0

[stretch]
uniform_z = false
gamma_z   = 2.6

[process]
npx = 1
npy = 1
npz = 2

[physics]
rayleigh          = 1.0e6
prandtl           = 0.7
delta_temperature = 0
gravity_axis      = 2

[initial]
perturb = 0.02

[time]
end_time = 250.0
dt_max   = 0.05
max_cfl  = 0.3
max_step = 0

[output]
stats_dir        = "stats_rbc_ra1e6/"
monitor_interval = 100
stats_start_time = 125.0
stats_interval   = 25.0
